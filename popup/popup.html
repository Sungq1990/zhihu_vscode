<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Zhihu VS Code Theme</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="titlebar">
    <span class="dot dot-red"></span>
    <span class="dot dot-yellow"></span>
    <span class="dot dot-green"></span>
    <span class="title">zhihu — settings.json</span>
  </header>

  <main>
    <div class="row">
      <div>
        <div class="key">"zhihu.vscodeTheme": <span id="value" class="value">true</span></div>
        <div class="hint">将知乎外观替换为 VS Code Dark+ 暗色主题</div>
      </div>
      <label class="switch" title="启用 / 停用换肤">
        <input type="checkbox" id="toggle" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="status" id="status">// …</div>

    <a class="link" href="https://www.zhihu.com/" target="_blank" rel="noreferrer">去知乎看看 ↗</a>
  </main>

  <footer>UTF-8&nbsp;&nbsp;JSON&nbsp;&nbsp;Ln 1, Col 1</footer>

  <script src="popup.js"></script>
</body>
</html>
